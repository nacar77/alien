<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR ALIEN:</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="overlay"></div>
        <div>
            <h1>Forever Begins with Each, Together</h1>
            <p>"Our Love, Stronger Every Month"</p>
            <div class="audio-container">
                <audio controls autoplay>
                    <source src="y2mate.com - You Are Not Alone  Michael Jackson Khel Pangilinan.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </header>
    
    <section id="photos">
        <h3>HAPPY MONTHSARY MY ALIEN</h3>
        <div class="slider">
            <div class="slider-row">
                <img src="1.png" alt="Photo 1">
                <img src="2.png" alt="Photo 2">
                <img src="3.png" alt="Photo 3">
                <img src="4.png" alt="Photo 4">
                <img src="5.png" alt="Photo 5">
                <img src="6.png" alt="Photo 6">
                <img src="7.png" alt="Photo 7">
                <img src="8.png" alt="Photo 8">
            </div>
        </div>
    </section>

    <section id="countdown">
        <h2 class="countdown">Countdown to the Big Moment</h2>
        <div id="timer"></div>
    </section>

    <script>
        let countdownTime = 3;

        function updateCountdown() {
            const timerElement = document.getElementById("timer");

            if (countdownTime <= 0) {
                document.getElementById("timer").innerHTML = `Your personalized message here...`;
                return;
            }

            timerElement.innerHTML = countdownTime;
            countdownTime--;
        }

        setInterval(updateCountdown, 1000);
    </script>
    <script src="script.js"></script>
</body>
</html>
